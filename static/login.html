<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growlouder  Console | Access Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="glass-card login-card">
            <div class="form-header">
                <h1>Growlouder  <span class="gradient-text">Console</span></h1>
                <p>Sign in to access your leads dashboard.</p>
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Admin Username</label>
                    <input type="text" id="username" name="username" class="input-control" placeholder="admin" required>
                </div>

                <div class="form-group">
                    <label for="password">Security Password</label>
                    <input type="password" id="password" name="password" class="input-control" placeholder="••••••••" required>
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn" id="login-btn">
                        <span>Sign In</span>
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"></path>
                        </svg>
                    </button>
                </div>
            </form>

            <div class="login-footer">
                <a href="/">← Return to Public Onboarding Form</a>
            </div>

            <!-- Brand Footer Credit -->
            <div class="brand-footer">
                <div class="powered-by">Powered by <a href="#" target="_blank">Uday Sorathiya</a></div>
                <div>For support & inquiries, reach out to <a href="mailto:uday.devworks@gmail.com">uday.devworks@gmail.com</a></div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container">
        <div class="toast toast-error" id="login-toast">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"></path>
            </svg>
            <span id="login-toast-message">Invalid credentials provided.</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const loginBtn = document.getElementById('login-btn');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginToast = document.getElementById('login-toast');
            const loginToastMessage = document.getElementById('login-toast-message');

            function showError(msg) {
                loginToastMessage.textContent = msg;
                loginToast.classList.add('show');
                setTimeout(() => {
                    loginToast.classList.remove('show');
                }, 5000);
            }

            // Session check before rendering
            async function checkSession() {
                try {
                    const res = await fetch('/api/check-session');
                    if (res.ok) {
                        window.location.href = '/dashboard';
                    }
                } catch(e) {}
            }
            checkSession();

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username || !password) {
                    showError("Please supply both administrative credentials.");
                    return;
                }

                // Visual loader feedback
                const origBtn = loginBtn.innerHTML;
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<div class="spinner"></div><span>Authenticating...</span>';

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const result = await response.json();

                    if (response.ok && result.status === 'success') {
                        window.location.href = '/dashboard';
                    } else {
                        throw new Error(result.detail || "Authentication challenge failed.");
                    }
                } catch (error) {
                    showError(error.message);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = origBtn;
                }
            });
        });
    </script>
</body>
</html>
